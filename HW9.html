<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenShop</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <h3>Categories</h3>
            <ul>
                <li class="active">House Plants</li>
                <li>Potter Plants</li>
                <li>Seeds</li>
                <li>Small Plants</li>
                <li>Big Plants</li>
                <li>Succulents</li>
                <li>Terrariums</li>
                <li>Gardening</li>
                <li>Accessories</li>
            </ul>

            <div class="sale-banner">
                <img src="images/super-sale-banner.png" alt="Sale">
            </div>
        </aside>

        <main class="content">

            <header class="header">
                <nav class="nav">
                    <a href="#" class="active">All Plants</a>
                    <a href="#">New Arrivals</a>
                    <a href="#">Sale</a>
                </nav>

                <div class="sort">
                    <span>Sort by:</span>
                    <select>
                        <option>Default sorting</option>
                    </select>
                </div>
            </header>

            <section class="products">

                <div class="product-card">
                    <div class="product-img">
                        <img src="images/p1.png" alt="Barberton Daisy">
                    </div>
                    <h3>Barberton Daisy</h3>
                    <p class="price">$119.00</p>
                </div>

                <div class="product-card">
                    <div class="product-img">
                        <img src="images/p2.png" alt="Angel Wing Begonia">

                        <div class="product-actions">
                            <span class="action-icon">🛒</span>
                            <span class="action-icon">♡</span>
                            <span class="action-icon">🔍</span>
                        </div>
                    </div>

                    <h3>Angel Wing Begonia</h3>
                    <p class="price">$169.00</p>
                </div>

                <div class="product-card">
                    <div class="product-img">
                        <img src="images/p3.png" alt="African Violet">

                        <span class="badge">13% OFF</span>

                        <div class="product-actions">
                            <span class="action-icon">🛒</span>
                            <span class="action-icon">♡</span>
                            <span class="action-icon">🔍</span>
                        </div>
                    </div>

                    <h3>African Violet</h3>
                    <p class="price">
                        $199.00 <span class="old-price">$229.00</span>
                    </p>
                </div>

            </section>

        </main>

    </div>

</body>

</html>
